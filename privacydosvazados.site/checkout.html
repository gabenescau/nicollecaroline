<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Checkout | Privacy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --fg: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #ff6b3d;
      --accent-hover: #ea580c;
      --surface: #f9fafb;
      --success: #059669;
      --error: #dc2626;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
      padding-block: max(24px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-bottom, 0px));
    }

    .checkout-container {
      width: 100%;
      max-width: 420px;
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .header p {
      color: var(--muted);
      font-size: 14px;
    }

    .plan-summary {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .plan-name {
      font-weight: 600;
      font-size: 16px;
    }

    .plan-price {
      font-weight: 700;
      font-size: 20px;
      color: var(--accent);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--fg);
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 16px;
      font-family: inherit;
      transition: border-color 0.2s;
      background: var(--bg);
      color: var(--fg);
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .form-group input::placeholder {
      color: #9ca3af;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 8px;
    }

    .btn-submit:hover {
      background: var(--accent-hover);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .qr-section {
      display: none;
      text-align: center;
      margin-top: 24px;
      padding: 24px;
      background: var(--surface);
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .qr-section.active {
      display: block;
    }

    .qr-image {
      max-width: 200px;
      margin: 0 auto 16px;
      border-radius: 8px;
    }

    .copy-paste-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-top: 16px;
      word-break: break-all;
      font-size: 12px;
      font-family: monospace;
      color: var(--muted);
      max-height: 80px;
      overflow-y: auto;
    }

    .btn-copy {
      margin-top: 12px;
      padding: 10px 20px;
      background: var(--fg);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .status-message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
      display: none;
    }

    .status-message.error {
      display: block;
      background: #fef2f2;
      color: var(--error);
      border: 1px solid #fecaca;
    }

    .status-message.success {
      display: block;
      background: #ecfdf5;
      color: var(--success);
      border: 1px solid #a7f3d0;
    }

    .loading-spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 24px;
      color: var(--muted);
      font-size: 14px;
      text-decoration: none;
    }

    .back-link:hover {
      color: var(--fg);
    }

    .trust-badges {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 20px;
      font-size: 12px;
      color: var(--muted);
    }

    .trust-badges span {
      display: flex;
      align-items: center;
      gap: 4px;
    }
  </style>
</head>
<body>
  <div class="checkout-container">
    <div class="header">
      <h1>Checkout Seguro</h1>
      <p>Complete seus dados para finalizar o pagamento</p>
    </div>

    <div class="plan-summary">
      <span class="plan-name" id="planName">Carregando...</span>
      <span class="plan-price" id="planPrice">--</span>
    </div>

    <form id="checkoutForm">
      <div class="form-group">
        <label for="payerName">Nome completo</label>
        <input type="text" id="payerName" placeholder="Seu nome completo" required autocomplete="name">
      </div>

      <div class="form-group">
        <label for="payerDocument">CPF</label>
        <input type="text" id="payerDocument" placeholder="000.000.000-00" maxlength="14" required autocomplete="off">
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        Gerar QR Code PIX
      </button>

      <div class="status-message" id="statusMessage"></div>
    </form>

    <div class="qr-section" id="qrSection">
      <img class="qr-image" id="qrImage" alt="QR Code PIX">
      <p style="font-size: 14px; color: var(--muted); margin-bottom: 8px;">Ou copie e cole no seu banco:</p>
      <div class="copy-paste-box" id="copyPasteText"></div>
      <button class="btn-copy" id="copyBtn">Copiar código PIX</button>
      <div class="status-message success" id="paymentStatus" style="margin-top: 16px;">
        Aguardando confirmação do pagamento...
      </div>
    </div>

    <div class="trust-badges">
      <span>&#128274; Pagamento seguro</span>
      <span>&#9889; Acesso imediato</span>
    </div>

    <a href="index.html" class="back-link">&larr; Voltar</a>
  </div>

  <script>
    // Configuração dos planos
    const PLANS = {
      '30dias': { name: '30 Dias', amount: 9.90, desc: 'Acesso por 30 dias' },
      '3meses': { name: '3 Meses', amount: 14.90, desc: 'Acesso por 3 meses' },
      '1ano': { name: '1 Ano', amount: 29.90, desc: 'Acesso por 1 ano' },
      'vitalicio': { name: 'Vitalício', amount: 34.90, desc: 'Acesso permanente' }
    };

    // Credenciais da API MisticPay
    const API_CONFIG = {
      baseUrl: 'https://api.misticpay.com/api',
      authHeader: 'Basic cGtfMTA1OWMyNmZjYTI5OGU0YWZkOWEyNTEyMmQ2N2VmNjY6c2tfZDkzZjdhMGI0NGJjZmMwMTJhM2I5ZWM5MzExOTI2YjExMTgwYjIyZWJhYzUyY2E4YTE1OTQ3N2ZkODExMmVlOA=='
    };

    let currentPlan = null;
    let currentTransactionId = null;
    let pollInterval = null;

    // Obter plano da URL
    function getPlanFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const planKey = params.get('plan');
      return PLANS[planKey] || PLANS['30dias'];
    }

    // Formatar CPF
    function formatCPF(value) {
      return value
        .replace(/\D/g, '')
        .replace(/(\d{3})(\d)/, '$1.$2')
        .replace(/(\d{3})(\d)/, '$1.$2')
        .replace(/(\d{3})(\d{1,2})/, '$1-$2')
        .replace(/(-\d{2})\d+?$/, '$1');
    }

    // Máscara de CPF
    document.getElementById('payerDocument').addEventListener('input', function(e) {
      e.target.value = formatCPF(e.target.value);
    });

    // Inicializar
    function init() {
      currentPlan = getPlanFromUrl();
      document.getElementById('planName').textContent = currentPlan.name;
      document.getElementById('planPrice').textContent = 'R$ ' + currentPlan.amount.toFixed(2).replace('.', ',');
    }

    // Criar transação na API
    async function createTransaction(name, document) {
      const cleanDoc = document.replace(/\D/g, '');

      const response = await fetch(API_CONFIG.baseUrl + '/transactions/create', {
        method: 'POST',
        headers: {
          'Authorization': API_CONFIG.authHeader,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          amount: currentPlan.amount,
          payerName: name,
          payerDocument: cleanDoc,
          description: 'Assinatura Privacy - ' + currentPlan.name,
          transactionId: 'privacy-' + Date.now()
        })
      });

      if (!response.ok) {
        const error = await response.json();
        throw new Error(error.message || 'Erro ao criar transação');
      }

      return response.json();
    }

    // Verificar status da transação
    async function checkTransaction(transactionId) {
      const response = await fetch(API_CONFIG.baseUrl + '/transactions/check', {
        method: 'POST',
        headers: {
          'Authorization': API_CONFIG.authHeader,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ transactionId: transactionId })
      });

      if (!response.ok) return null;
      return response.json();
    }

    // Mostrar QR Code
    function showQRCode(data) {
      const qrSection = document.getElementById('qrSection');
      const qrImage = document.getElementById('qrImage');
      const copyPasteText = document.getElementById('copyPasteText');

      qrImage.src = data.qrCodeBase64 || data.qrcodeUrl;
      copyPasteText.textContent = data.copyPaste;
      qrSection.classList.add('active');

      // Esconder formulário
      document.getElementById('checkoutForm').style.display = 'none';

      // Iniciar polling para verificar pagamento
      startPolling(data.transactionId);
    }

    // Polling para verificar pagamento
    function startPolling(transactionId) {
      currentTransactionId = transactionId;

      pollInterval = setInterval(async () => {
        try {
          const result = await checkTransaction(transactionId);
          if (result && result.transaction) {
            const status = result.transaction.transactionState;

            if (status === 'COMPLETO') {
              clearInterval(pollInterval);
              document.getElementById('paymentStatus').innerHTML = '&#10004; Pagamento confirmado! Redirecionando...';
              setTimeout(() => {
                window.location.href = 'obrigado.html';
              }, 2000);
            } else if (status === 'FALHA') {
              clearInterval(pollInterval);
              document.getElementById('paymentStatus').className = 'status-message error';
              document.getElementById('paymentStatus').innerHTML = 'Pagamento falhou. Tente novamente.';
            }
          }
        } catch (e) {
          console.error('Erro ao verificar pagamento:', e);
        }
      }, 5000);
    }

    // Copiar código PIX
    document.getElementById('copyBtn').addEventListener('click', async function() {
      const code = document.getElementById('copyPasteText').textContent;
      try {
        await navigator.clipboard.writeText(code);
        this.textContent = 'Copiado!';
        setTimeout(() => {
          this.textContent = 'Copiar código PIX';
        }, 2000);
      } catch (e) {
        // Fallback
        const textarea = document.createElement('textarea');
        textarea.value = code;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        this.textContent = 'Copiado!';
        setTimeout(() => {
          this.textContent = 'Copiar código PIX';
        }, 2000);
      }
    });

    // Submit do formulário
    document.getElementById('checkoutForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const submitBtn = document.getElementById('submitBtn');
      const statusMessage = document.getElementById('statusMessage');
      const name = document.getElementById('payerName').value.trim();
      const document_ = document.getElementById('payerDocument').value;

      if (!name || !document_) {
        statusMessage.className = 'status-message error';
        statusMessage.textContent = 'Preencha todos os campos';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="loading-spinner"></span>Gerando QR Code...';
      statusMessage.style.display = 'none';

      try {
        const result = await createTransaction(name, document_);
        showQRCode(result.data);
      } catch (error) {
        statusMessage.className = 'status-message error';
        statusMessage.textContent = error.message || 'Erro ao processar. Tente novamente.';
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Gerar QR Code PIX';
      }
    });

    // Inicializar ao carregar
    init();
  </script>
</body>
</html>
